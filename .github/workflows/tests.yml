name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the manifest parses
        run: jq -e '.schemaVersion == 1 and (.id | length > 0)' manifest.json
      - name: Run tests
        run: ./tests/run
